<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Typing Skill Assessment</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./style/design.css" />
  </head>
  <body>
    <div class="bg-grid"></div>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="noise"></div>

    <header class="py-4">
      <nav
        class="navbar navbar-expand-md navbar-dark container-xxl rounded-3 px-3 glass-nav"
      >
        <a class="navbar-brand fw-semibold">
          <span class="brand-dot me-2"></span> Typing Skill Assessment
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navMain"
          aria-controls="navMain"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div id="navMain" class="collapse navbar-collapse">
          <ul class="navbar-nav ms-auto gap-2">
            <li class="nav-item">
              <a class="nav-link">Help</a>
            </li>
          </ul>
        </div>
      </nav>
    </header>

    <main class="position-relative z-1">
      <!-- TextArea Section-->

      <section class="container-xxl py-2">
        <div class="d-flex align-items-center gap-3">
          <h3>Clock:</h3>
          <h3 class="text-white fw-semibold" id="currentTime"></h3>
        </div>

        <div class="mb-2 d-flex align-items-center gap-3">
          <h3>Timer:</h3>
          <h3 class="text-white fw-semibold" id="timer"></h3>
        </div>

        <div class="row justify-content-center">
          <div class="col-lg-10">
            <textarea
              id="textarea"
              class="form-control form-control-lg p-4 rounded-4 shadow-lg bg-white"
              rows="5"
              placeholder="Please start typing..."
            ></textarea>
          </div>
        </div>

        <div class="mt-3 text-center">
          <button
            id="resetBtn"
            type="button"
            class="btn btn-outline-danger btn-lg"
          >
            Reset
          </button>
        </div>
      </section>

      <!-- Summary Section -->
      <section id="features" class="container-xxl py-1 mb-5">
        <h2 class="text-white fw-semibold mb-4">Summary:</h2>
        <div class="row g-4">
          <div class="col-md-4">
            <div
              class="p-4 rounded-4 border border-light-subtle bg-white bg-opacity-10 text-white"
            >
              <h3 class="h5" id="wps"></h3>
              <h3 class="h5" id="cps"></h3>
              <h3 class="h5" id="spm"></h3>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Bootstrap Bundle -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="./script/scriptFile.js"></script>
  </body>
</html>
