<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Statement Entry Page</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../styles/style.css" />
  </head>
  <body>
    <!-- Main Content -->
    <div class="container mt-5">
      <div class="statement-card p-4 bg-white rounded-3 shadow-sm">
        <!-- Title -->
        <div class="d-flex align-items-center justify-content-between mb-3">
          <h2 class="h4 mb-0">Statement Entry</h2>
        </div>
        <hr class="border-3" />

        <!-- Header titles -->
        <div
          class="row g-2 text-uppercase fw-semibold small text-secondary pb-2 border-bottom"
        >
          <div class="col-2 col-md-1">Id</div>
          <div class="col-10 col-md-3">Date-Of-Transaction</div>
          <div class="col-12 col-md-3">Header</div>
          <div class="col-6 col-md-2">Credit</div>
          <div class="col-6 col-md-1">Debit</div>
        </div>

        <!-- form -->
        <form
          id="entryForm"
          class="row g-2 align-items-center py-3 border-bottom"
        >
          <div class="col-2 col-md-1">
            <input
              id="inputId"
              type="text"
              class="form-control form-control-sm border-1 border-dark"
              placeholder="#"
              aria-label="Id"
              autocomplete="off"
            />
          </div>
          <div class="col-10 col-md-3">
            <input
              id="inputDate"
              type="date"
              class="form-control form-control-sm border-1 border-dark"
              aria-label="Date of Transaction"
              required
              autocomplete="off"
            />
          </div>
          <div class="col-12 col-md-3">
            <input
              id="inputHeader"
              type="text"
              class="form-control form-control-sm border-1 border-dark"
              placeholder="Header"
              aria-label="Header"
              autocomplete="off"
            />
          </div>

          <div class="col-12 col-md-4">
            <div class="row g-2 amount-group">
              <div class="col-6 col-md-4 amount-cell" id="creditCell">
                <input
                  id="inputCredit"
                  type="text"
                  inputmode="decimal"
                  class="form-control form-control-sm text-md-end border-1 border-dark editable-input"
                  placeholder="0"
                  aria-label="Credit"
                  autocomplete="off"
                />
              </div>

              <div class="col-6 col-md-4 amount-cell" id="debitCell">
                <input
                  id="inputDebit"
                  type="text"
                  inputmode="decimal"
                  class="form-control form-control-sm text-md-end border-1 border-dark editable-input"
                  placeholder="0"
                  aria-label="Debit"
                  autocomplete="off"
                />
              </div>
            </div>
          </div>

          <div class="col-12 col-md-1 text-end">
            <button
              id="addBtn"
              type="submit"
              class="btn btn-sm btn-primary w-100 w-md-auto"
            >
              Add
            </button>
          </div>
        </form>

        <div id="entries"></div>

        <hr class="border-3" />

        <div class="row g-2 align-items-center py-3 border-bottom bg-light">
          <div class="col-6 col-md-8 text-end">
            <span class="fw-semibold">Totals :</span>
          </div>
          <div class="col-6 col-md-1 text-md-end fw-semibold">
            <span id="totalsCredit">0</span>
          </div>
          <div class="col-6 col-md-2 text-md-end fw-semibold">
            <span id="totalsDebit">0</span>
          </div>
          <div class="d-none d-md-block col-md-1"></div>
        </div>

        <!-- Balance -->
        <hr class="border-3" />
        <div class="row g-2 align-items-center py-3">
          <div class="col-12 col-md-10 text-end">
            <span class="fw-bold">Balance :</span>
          </div>
          <div class="col-12 col-md-2 text-md-end fw-bold">
            <span id="balanceValue">0</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JS -->
    <script src="../lib/script.js"></script>
  </body>
</html>
