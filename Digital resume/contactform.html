<!doctype html>
<html lang="en">
  <head>
    <title>Digital Resume - Kanagaraj K | Contact Form</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <nav class="navbar navbar-inverse">
        <div class="container-fluid">
         
          <ul class="nav navbar-nav">
            <li class="active"><a href="biodata.html">Biodata</a></li>
            <li class="active"><a href="education.html">Education</a></li>
            <li class="active"><a href="skillset.html">Skillset</a></li>
            <li class="active"><a href="experience.html">Experience</a></li>
            <li class="active"><a href="contactform.html">Contact Form</a></li>
          </ul>
        </div>
      </nav>
    </header>

    <div class="container">
      <h3>Contact Form</h3>

      <div class="container py-4">
        <div class="row justify-content-center">
          <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm">
              <div class="card-body">
                <form>
                  <div class="mb-3">
                    <label for="name" class="form-label">Name</label>
                    <input
                      type="name"
                      class="form-control"
                      id="name"
                      placeholder="use name"
                    />
                  </div>

                  <div class="emailInput mb-3">
                    <label for="email" class="form-label">Email address</label>
                    <input
                      type="email"
                      class="form-control"
                      id="email"
                      placeholder="name@example.com"
                    />
                  </div>

                  <div class="messageInput mb-3">
                    <label for="message" class="form-label">Message</label>
                    <textarea
                      class="form-control"
                      id="message"
                      rows="3"
                      placeholder="Write a short message (optional)"
                    ></textarea>
                  </div>
                </form>
              </div>
              <div>
                <button type="button" class="btn btn-primary">Submit</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <footer>
      <p>Digital Resume || Kanagaraj K</p>
    </footer>
  </body>
</html>
